[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roadlens-radar"
version = "1.0.0"
description = "Local calibrated vehicle tracking and speed estimation workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.9,<3",
  "numpy>=2.1,<3",
  "opencv-python>=4.14,<5",
  "av>=14,<17",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
